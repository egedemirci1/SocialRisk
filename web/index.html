<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sosyal Risk — Arkadaşlarınla oyna, risk al!">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sosyal Risk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Sosyal Risk</title>
  <link rel="manifest" href="manifest.json">

  <!-- Native splash style — shows INSTANTLY before Flutter loads -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #16103A;
      /* AppColors.background */
      overflow: hidden;
    }

    #native-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #231D4D 0%, #16103A 100%);
      transition: opacity 0.4s ease-out;
    }

    #native-splash.removing {
      opacity: 0;
      pointer-events: none;
    }

    .logo-pulse {
      animation: pulse 2s infinite ease-in-out alternate;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .s-logo {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #22D3EE 0%, #06B6D4 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.3);
      padding: 10px;
      position: relative;
    }

    .s-logo-inner {
      width: 100%;
      height: 100%;
      background: #16103A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFB020;
      font-family: 'Inter', 'Nunito', 'Segoe UI', sans-serif;
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
    }

    .brand-title {
      font-family: 'Inter', 'Nunito', 'Segoe UI', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 2px;
      margin-top: 32px;
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }

    .subtitle {
      margin-top: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #06B6D4;
      letter-spacing: 1.5px;
      opacity: 0.8;
    }

    .spinner {
      margin-top: 48px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(6, 182, 212, 0.1);
      border-top-color: #06B6D4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.2));
      }

      100% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 40px rgba(6, 182, 212, 0.4));
      }
    }
  </style>
</head>

<body>
  <!-- Native splash — visible immediately, auto-removed when Flutter renders -->
  <div id="native-splash">
    <div class="logo-pulse">
      <div class="s-logo">
        <div class="s-logo-inner">S</div>
      </div>
    </div>
    <div class="brand-title">Social Risk</div>
    <div class="subtitle">Parti Hazırlanıyor...</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove the native splash overlay when Flutter is ready
    var splashRemoved = false;
    function removeSplash() {
      if (splashRemoved) return;
      splashRemoved = true;
      var el = document.getElementById('native-splash');
      if (el) {
        el.classList.add('removing');
        setTimeout(function () { el.remove(); }, 500);
      }
    }
    window.removeSplashWhenReady = removeSplash;

    function scheduleSplashRemoval() {
      setTimeout(removeSplash, 600);
    }
    window.addEventListener('flutter-first-frame', scheduleSplashRemoval);
    var observer = new MutationObserver(function () {
      if (document.querySelector('flt-glass-pane, flutter-view, flt-scene-host')) {
        scheduleSplashRemoval();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(removeSplash, 8000);
  </script>
  <script>
    // Firebase Auth persistence için localStorage kontrolü
    (function () {
      try {
        if (typeof (Storage) !== "undefined") {
          console.log('localStorage is available for Firebase Auth persistence');
        } else {
          console.warn('localStorage is not available');
        }
      } catch (e) {
        console.error('Error checking localStorage:', e);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
