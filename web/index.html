<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sosyal Risk — Arkadaşlarınla oyna, risk al!">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sosyal Risk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Sosyal Risk</title>
  <link rel="manifest" href="manifest.json">

  <!-- Native splash style — shows INSTANTLY before Flutter loads -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0D0D1A;
      overflow: hidden;
    }

    #native-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0D0D1A;
      transition: opacity 0.4s ease-out;
    }

    #native-splash.removing {
      opacity: 0;
      pointer-events: none;
    }

    #native-splash .emoji {
      font-size: 64px;
      filter: drop-shadow(0 0 40px rgba(233, 69, 96, 0.4));
      animation: pulse 1.5s infinite ease-in-out;
    }

    #native-splash .title {
      margin-top: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    #native-splash .subtitle {
      margin-top: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.38);
    }

    #native-splash .spinner {
      margin-top: 32px;
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #E94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }
  </style>
</head>

<body>
  <!-- Native splash — visible immediately, auto-removed when Flutter renders -->
  <div id="native-splash">
    <div class="emoji">🎮</div>
    <div class="title">Sosyal Risk</div>
    <div class="subtitle">Yükleniyor...</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove the native splash overlay when Flutter is ready
    var splashRemoved = false;
    function removeSplash() {
      if (splashRemoved) return;
      splashRemoved = true;
      var el = document.getElementById('native-splash');
      if (el) {
        el.classList.add('removing');
        setTimeout(function () { el.remove(); }, 500);
      }
    }

    // Delay splash removal so LoginScreen has time to fully paint
    function scheduleSplashRemoval() {
      setTimeout(removeSplash, 600);
    }

    // Method 1: Listen for Flutter's first-frame event
    window.addEventListener('flutter-first-frame', scheduleSplashRemoval);

    // Method 2: MutationObserver — detect when Flutter adds its rendering elements
    var observer = new MutationObserver(function () {
      if (document.querySelector('flt-glass-pane, flutter-view, flt-scene-host')) {
        scheduleSplashRemoval();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Method 3: Fallback timeout — remove after 8 seconds no matter what
    setTimeout(removeSplash, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
