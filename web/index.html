<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sosyal Risk — Arkadaşlarınla oyna, risk al!">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sosyal Risk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Sosyal Risk</title>
  <link rel="manifest" href="manifest.json">

  <!-- Native splash style — shows INSTANTLY before Flutter loads -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #140D0B;
      overflow: hidden;
    }

    #native-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #140D0B;
      background-image: url('assets/Loading-Screen-Background.png');
      background-size: cover;
      background-position: center;
      transition: opacity 0.4s ease-out;
    }
    
    /* Karartma (Overlay) Efekti */
    #native-splash::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(20, 13, 11, 0.5);
      z-index: -1;
    }

    #native-splash.removing {
      opacity: 0;
      pointer-events: none;
    }

    .glow-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .glow-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 80px;
      background: transparent;
      border-radius: 40px;
      box-shadow: 0 0 70px 20px rgba(212, 175, 55, 0.4),
                  0 0 100px 40px rgba(139, 0, 0, 0.35);
      z-index: 0;
      animation: pulse 2s infinite ease-in-out alternate;
    }

    #native-splash .title {
      position: relative;
      z-index: 1;
      font-family: 'Times New Roman', Times, serif; /* Fallback for Cinzel Decorative before fonts load */
      font-size: 48px;
      font-weight: 900;
      color: #FDEFC2;
      letter-spacing: 2px;
      text-shadow: 0px 5px 15px rgba(0, 0, 0, 0.87);
      margin: 0;
    }

    #native-splash .subtitle {
      position: relative;
      z-index: 1;
      margin-top: 16px;
      font-family: 'Times New Roman', Times, serif; /* Fallback for Cinzel */
      font-size: 16px;
      font-weight: bold;
      color: #D4AF37;
      letter-spacing: 1.5px;
      text-shadow: 0px 2px 5px rgba(0, 0, 0, 1);
    }

    #native-splash .spinner {
      position: relative;
      z-index: 1;
      margin-top: 48px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 50px 10px rgba(212, 175, 55, 0.3),
                    0 0 80px 30px rgba(139, 0, 0, 0.25);
      }
      100% {
        box-shadow: 0 0 70px 20px rgba(212, 175, 55, 0.5),
                    0 0 100px 40px rgba(139, 0, 0, 0.45);
      }
    }
  </style>
</head>

<body>
  <!-- Native splash — visible immediately, auto-removed when Flutter renders -->
  <div id="native-splash">
    <div class="glow-container">
      <div class="glow-bg"></div>
      <div class="title">Sosyal Risk</div>
    </div>
    <div class="subtitle">Maceraya Atılıyor...</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove the native splash overlay when Flutter is ready
    var splashRemoved = false;
    function removeSplash() {
      if (splashRemoved) return;
      splashRemoved = true;
      var el = document.getElementById('native-splash');
      if (el) {
        el.classList.add('removing');
        setTimeout(function () { el.remove(); }, 500);
      }
    }

    // Delay splash removal so LoginScreen has time to fully paint
    function scheduleSplashRemoval() {
      setTimeout(removeSplash, 600);
    }

    // Method 1: Listen for Flutter's first-frame event
    window.addEventListener('flutter-first-frame', scheduleSplashRemoval);

    // Method 2: MutationObserver — detect when Flutter adds its rendering elements
    var observer = new MutationObserver(function () {
      if (document.querySelector('flt-glass-pane, flutter-view, flt-scene-host')) {
        scheduleSplashRemoval();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Method 3: Fallback timeout — remove after 8 seconds no matter what
    setTimeout(removeSplash, 8000);

    // Firebase Auth persistence için localStorage kontrolü
    // Flutter web'de Firebase Auth otomatik olarak localStorage kullanır
    // Ancak bazen Chrome'da flutter run ile çalıştırırken localStorage temizlenebilir
    // Bu script localStorage'ın korunmasını sağlar
    (function() {
      // localStorage'ın mevcut olup olmadığını kontrol et
      try {
        if (typeof(Storage) !== "undefined") {
          // localStorage mevcut, Firebase Auth oturum bilgileri burada saklanacak
          console.log('localStorage is available for Firebase Auth persistence');
        } else {
          console.warn('localStorage is not available');
        }
      } catch (e) {
        console.error('Error checking localStorage:', e);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
