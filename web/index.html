<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sosyal Risk — Arkadaşlarınla oyna, risk al!">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sosyal Risk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Sosyal Risk</title>
  <link rel="manifest" href="manifest.json">

  <!-- Native splash style — shows INSTANTLY before Flutter loads -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #16103A;
      /* AppColors.background */
      overflow: hidden;
    }

    #native-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #16103A;
      /* background-image: url('assets/Loading-Screen-Background.png'); */
      background-size: cover;
      background-position: center;
      transition: opacity 0.4s ease-out;
    }

    /* Karartma (Overlay) Efekti - Artık kullanılmıyor ama kalsın */
    #native-splash::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(22, 16, 58, 0.2);
      z-index: -1;
    }

    #native-splash.removing {
      opacity: 0;
      pointer-events: none;
    }

    .glow-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .glow-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 80px;
      background: transparent;
      border-radius: 40px;
      box-shadow: 0 0 70px 20px rgba(255, 176, 32, 0.15),
        0 0 100px 40px rgba(6, 182, 212, 0.2);
      z-index: 0;
      animation: pulse 2s infinite ease-in-out alternate;
    }

    #native-splash .title {
      position: relative;
      z-index: 1;
      font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
      font-size: 48px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 1.5px;
      margin: 0;
    }

    #native-splash .subtitle {
      position: relative;
      z-index: 1;
      margin-top: 16px;
      font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #FFB020;
      letter-spacing: 1.0px;
    }

    #native-splash .spinner {
      position: relative;
      z-index: 1;
      margin-top: 48px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 176, 32, 0.2);
      border-top-color: #FFB020;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 50px 10px rgba(255, 176, 32, 0.1),
          0 0 80px 30px rgba(6, 182, 212, 0.15);
      }

      100% {
        box-shadow: 0 0 70px 20px rgba(255, 176, 32, 0.2),
          0 0 100px 40px rgba(6, 182, 212, 0.25);
      }
    }
  </style>
</head>

<body>
  <!-- Native splash — visible immediately, auto-removed when Flutter renders -->
  <div id="native-splash">
    <div class="glow-container">
      <div class="glow-bg"></div>
      <div class="title">Social Risk</div>
    </div>
    <div class="subtitle">Parti Hazırlanıyor...</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove the native splash overlay when Flutter is ready
    var splashRemoved = false;
    function removeSplash() {
      if (splashRemoved) return;
      splashRemoved = true;
      var el = document.getElementById('native-splash');
      if (el) {
        el.classList.add('removing');
        setTimeout(function () { el.remove(); }, 500);
      }
    }
    window.removeSplashWhenReady = removeSplash;

    function scheduleSplashRemoval() {
      setTimeout(removeSplash, 600);
    }
    window.addEventListener('flutter-first-frame', scheduleSplashRemoval);
    var observer = new MutationObserver(function () {
      if (document.querySelector('flt-glass-pane, flutter-view, flt-scene-host')) {
        scheduleSplashRemoval();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(removeSplash, 8000);
  </script>
  <script>
    // Firebase Auth persistence için localStorage kontrolü
    (function () {
      try {
        if (typeof (Storage) !== "undefined") {
          console.log('localStorage is available for Firebase Auth persistence');
        } else {
          console.warn('localStorage is not available');
        }
      } catch (e) {
        console.error('Error checking localStorage:', e);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
